[workspace]
resolver = "2"
members = [
    "crates/ig-proto",
    "crates/ig-core",
    "crates/ig-lighthouse",
    "crates/ig-node",
    "crates/ig-cli",
    "crates/ig-mobile",
    "crates/ig-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wiltaylor/intergalactic"

[workspace.dependencies]
ig-proto = { path = "crates/ig-proto" }
ig-core = { path = "crates/ig-core" }
ig-lighthouse = { path = "crates/ig-lighthouse" }
ig-node = { path = "crates/ig-node" }

anyhow = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
thiserror = "2"
tokio = { version = "1.44", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
base64 = "0.22"
ipnet = { version = "2", features = ["serde"] }
parking_lot = "0.12"
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
humantime = "2"
getrandom = "0.3"
blake3 = { version = "1", default-features = false, features = ["pure"] }
snow = "0.10"
boringtun = { version = "0.7", default-features = false }
x25519-dalek = { version = "2", features = ["static_secrets"] }
if-addrs = "0.15"
gethostname = "1"
interprocess = { version = "2.4", features = ["tokio"] }
tun-rs = { version = "2.8", features = ["async_tokio"] }
uniffi = "0.32"
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
